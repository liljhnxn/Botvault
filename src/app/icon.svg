<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#baff69" />
      <stop offset="100%" stop-color="#73e3bd" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#baff69" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded plate -->
  <rect width="32" height="32" rx="8" fill="#07110f" />
  <rect width="30" height="30" x="1" y="1" rx="7" fill="#0e231e" stroke="url(#vaultGrad)" stroke-width="1.2" opacity="0.9" />

  <!-- Vault Lock Symbol -->
  <g filter="url(#glow)">
    <!-- Shackle -->
    <path d="M11 14V11a5 5 0 0 1 10 0v3" fill="none" stroke="url(#vaultGrad)" stroke-width="2.2" stroke-linecap="round" />
    
    <!-- Lock Body -->
    <rect x="9" y="14" width="14" height="11" rx="3" fill="url(#vaultGrad)" />
    
    <!-- Keyhole -->
    <circle cx="16" cy="18.5" r="1.5" fill="#07110f" />
    <path d="M15.2 19.5h1.6l0.6 2.5h-2.8z" fill="#07110f" />
  </g>
</svg>
